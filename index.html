<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080e21">
<title>Alles Gute, Max!</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;overflow-x:hidden;
  background:radial-gradient(ellipse at center,#26334f,#080e21 75%);
  color:#fff0d0;font-family:Georgia,serif;
  display:flex;align-items:center;justify-content:center;
}
main{text-align:center;width:min(100%,480px);padding:30px 18px}
small{font:10px Arial;letter-spacing:3px;color:#d2b77e}
h1{font-size:56px;font-weight:normal;margin:18px 0 8px}
h1 span{color:#f4ce85}
.intro{color:#bcc3d3;font-size:17px}
.scene{height:285px;position:relative;margin-top:20px}
.halo{
  position:absolute;inset:0;
  background:radial-gradient(ellipse,#ffc34d24,transparent 65%);
  transition:opacity 1s;
}
.plate{
  position:absolute;bottom:10px;left:4%;width:92%;height:40px;
  border-radius:50%;background:linear-gradient(#ead6ac,#927550);
  box-shadow:0 18px 30px #0007;
}
.cake{
  position:absolute;left:10%;bottom:28px;width:80%;height:120px;
  border-radius:50% / 20%;
  background:linear-gradient(90deg,#34232d,#795044,#31212c);
  box-shadow:inset 0 -8px 0 #c6986c;
}
.cake:before{
  content:"";position:absolute;top:-6px;left:0;width:100%;height:58px;
  border-radius:50%;background:linear-gradient(#fff0cf,#dcb78a);
  box-shadow:0 10px 0 #d0a779;
}
.number{
  position:absolute;bottom:18px;width:100%;
  font-size:38px;color:#f4d39a;
}
.candle{
  position:absolute;width:7px;height:47px;border-radius:3px;
  background:linear-gradient(90deg,#aa7740,#ffe6ab,#bb8646);
}
.wick{
  position:absolute;top:-5px;left:3px;width:1px;height:6px;background:#34251f;
}
.flame{
  position:absolute;bottom:50px;left:-3px;width:13px;height:24px;
  border-radius:65% 35% 55% 45%;
  background:radial-gradient(ellipse at 50% 75%,#fffbe4 10%,#ffe195 40%,#ffa62b 75%);
  box-shadow:0 0 12px #ffcb65,0 0 28px #ffaf4266;
  transform-origin:bottom;animation:flicker .7s ease-in-out infinite alternate;
  transition:opacity .25s;
}
@keyframes flicker{
  from{transform:rotate(-6deg) scale(.95,1)}
  to{transform:rotate(7deg) scale(1,.9)}
}
.smoke{
  position:absolute;left:1px;top:-20px;width:9px;height:25px;
  border-left:2px solid #dde3ed;border-radius:50%;opacity:0;
}
.off .flame{opacity:0;animation:none}
.off .smoke{animation:smoke 1.8s ease-out forwards}
@keyframes smoke{
  20%{opacity:.55}
  100%{opacity:0;transform:translate(12px,-45px) scale(2)}
}
h2{font-size:25px;font-weight:normal;margin:18px 0 12px}
#status{font:14px/1.6 Arial;color:#bbc3d4;min-height:46px}
button{cursor:pointer;touch-action:manipulation}
#start{
  border:0;border-radius:40px;padding:16px 28px;
  background:linear-gradient(120deg,#ffe3a6,#c99a51);
  color:#222338;font:15px Arial;min-width:235px;
}
#start:disabled{opacity:.6}
#fallback{
  display:block;margin:12px auto;border:0;padding:10px;
  background:none;color:#aab4ca;text-decoration:underline;
}
.privacy{font:10px/1.6 Arial;color:#8490a7;margin-top:16px}
.confetti{
  position:fixed;top:-20px;width:7px;height:12px;
  pointer-events:none;z-index:10;animation:fall 4s linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){
  .flame,.off .smoke,.confetti{animation:none}
}
</style>
</head>
<body>
<main>
  <small>EIN NEUES JAHRZEHNT BEGINNT</small>
  <h1>Für dich, <span>Max.</span></h1>
  <p class="intro">20 Jahre. Tausend Möglichkeiten.</p>
  <div class="scene" role="img" aria-label="Geburtstagstorte mit 20 Kerzen">
    <div class="halo" id="halo"></div>
    <div class="plate"></div>
    <div class="cake"><div class="number">20</div></div>
    <div id="candles"></div>
  </div>
  <h2 id="title">Schließ die Augen. Wünsch dir was.</h2>
  <p id="status" role="status" aria-live="polite">
    Puste deine Kerzen aus.<br>Dieser Moment gehört dir.
  </p>
  <button id="start">✧ Wünsch dir was</button>
  <button id="fallback">Ohne Mikrofon auspusten</button>
  <p class="privacy">Der Ton bleibt auf deinem Handy. Keine Aufnahme.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const candles = [];
for(let row=0;row<4;row++){
  for(let col=0;col<5;col++){
    const candle=document.createElement('div');
    candle.className='candle';
    candle.style.left=(24+col*12+(row%2?2:0))+'%';
    candle.style.top=(89+row*11)+'px';
    candle.innerHTML='<i class="wick"></i><i class="flame"></i><i class="smoke"></i>';
    candle.querySelector('.flame').style.animationDelay=-(row*5+col)*.13+'s';
    $('candles').appendChild(candle);
    candles.push(candle);
  }
}
let stream=null, audio=null, frame=0, generation=0;
let busy=false, finished=false;

function stopMicrophone(){
  cancelAnimationFrame(frame);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(audio){audio.close().catch(()=>{});audio=null}
}

function blowOut(){
  if(finished)return;
  finished=true;
  generation++;
  stopMicrophone();
  $('start').disabled=true;
  $('fallback').style.display='none';
  candles.forEach((c,i)=>setTimeout(()=>c.classList.add('off'),i*55));
  $('halo').style.opacity=0;
  setTimeout(()=>{
    $('title').textContent='Alles Gute zum Geburtstag, Max!';
    $('status').textContent='Auf die 20 und all die wunderbaren Abenteuer, die vor dir liegen!';
    $('start').textContent='↻ Noch einmal';
    $('start').disabled=false;
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
      for(let i=0;i<75;i++){
        const p=document.createElement('i');
        p.className='confetti';
        p.style.left=Math.random()*100+'vw';
        p.style.background=['#efc875','#fff1cb','#aebddc'][i%3];
        p.style.animationDelay=Math.random()*1.5+'s';
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),6000);
      }
    }
  },1300);
}

$('fallback').onclick=blowOut;
$('start').onclick=async()=>{
  if(finished){location.reload();return}
  if(busy)return;
  busy=true;
  const current=++generation;
  $('start').disabled=true;
  $('status').textContent='Bitte erlaube den Zugriff auf dein Mikrofon.';
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('No microphone');
    audio=new(window.AudioContext||window.webkitAudioContext)();
    await audio.resume();
    const incoming=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
    });
    if(current!==generation){
      incoming.getTracks().forEach(t=>t.stop());
      return;
    }
    stream=incoming;
    const analyser=audio.createAnalyser();
    analyser.fftSize=2048;
    audio.createMediaStreamSource(stream).connect(analyser);
    const samples=new Float32Array(analyser.fftSize);
    let total=0,count=0,energy=0;
    const beginning=performance.now();
    let previous=beginning;
    $('status').textContent='Einen Moment bitte ganz leise sein …';

    function listen(now){
      if(current!==generation)return;
      analyser.getFloatTimeDomainData(samples);
      let sum=0;
      for(const sample of samples)sum+=sample*sample;
      const volume=Math.sqrt(sum/samples.length);
      const elapsed=Math.min(now-previous,80);
      previous=now;
      if(now-beginning<1400){
        total+=volume;count++;
      }else{
        $('status').textContent='Puste jetzt sanft in die Nähe des Handy-Mikrofons.';
        const threshold=Math.max(.006,total/Math.max(count,1)*1.6);
        energy=volume>threshold?energy+elapsed:Math.max(0,energy-elapsed*1.5);
        if(energy>180){blowOut();return}
      }
      frame=requestAnimationFrame(listen);
    }
    frame=requestAnimationFrame(listen);
  }catch(error){
    if(current!==generation)return;
    stopMicrophone();
    busy=false;
    $('start').disabled=false;
    $('start').textContent='Mikrofon erneut versuchen';
    $('status').textContent='Kein Mikrofonzugriff. Versuche es erneut oder nutze den Button unten.';
  }
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    generation++;
    stopMicrophone();
    if(!finished){
      busy=false;
      $('start').disabled=false;
      $('status').textContent='Tippe auf den Button, um zu beginnen.';
    }
  }
});
window.addEventListener('pagehide',()=>{
  generation++;
  stopMicrophone();
});
</script>
</body>
</html>
